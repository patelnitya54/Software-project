<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workin' | Candidate Onboarding & Preferences</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/onboarding.css">
</head>

</head>

<body>

    <div class="fullscreen-glow"></div>

    <header class="header">
        <div class="header-left">
            <div class="logo" title="Workin'" onclick="window.location.href='index.html'" style="cursor: pointer;">
                <img src="assets/images/logo.png" alt="Workin' Logo">
            </div>
        </div>
        <div class="progress-wrap">
            <div class="progress" id="progress" title="Jump to question"></div>
            <div class="progress-step-info">
                <span id="progressStepNumber">Step 1 of 25</span>
                <span id="progressStepCategory" style="margin-left: 6px; color: #888;">• Introduction</span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-reset-btn" id="headerResetBtn" onclick="clearAllSelections()" title="Reset all answers and start fresh">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Reset</span>
            </button>
            <button class="signin" id="signInHeaderBtn" onclick="openSignInModal()">Sign In</button>
        </div>
    </header>

    <input type="file" id="resumeFileInput" accept=".pdf,.doc,.docx,.txt" style="display:none">

    <!-- Toast Notification -->
    <div id="toastNotification" style="position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: #ffffff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 100000; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.15); transition: opacity 0.3s ease; opacity: 0; pointer-events: none;"></div>

    <!-- Sign In Modal -->
    <div id="signInModal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 100001; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div style="background: white; border-radius: 20px; padding: 36px 32px; width: 420px; max-width: 90%; box-shadow: 0 24px 48px rgba(0,0,0,0.18); font-family: var(--font-body); position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="margin: 0; font-size: 22px; font-weight: 600; color: #1a1a18;">Welcome back</h3>
                <span onclick="closeSignInModal()" style="cursor: pointer; font-size: 26px; line-height: 1; color: #888;">&times;</span>
            </div>
            <p style="font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5;">Sign in or load your profile to view tailored matching jobs.</p>
            <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
                <div>
                    <label style="font-size: 13px; color: #444; font-weight: 500; display: block; margin-bottom: 6px;">Email address</label>
                    <input type="email" id="signInEmail" placeholder="you@domain.com" value="bhavya.amin@example.com" style="width: 100%; padding: 12px 14px; border: 1px solid #dcdcdc; border-radius: 10px; font-size: 14px; outline: none;">
                </div>
                <div>
                    <label style="font-size: 13px; color: #444; font-weight: 500; display: block; margin-bottom: 6px;">Password</label>
                    <input type="password" id="signInPassword" placeholder="••••••••" value="password123" style="width: 100%; padding: 12px 14px; border: 1px solid #dcdcdc; border-radius: 10px; font-size: 14px; outline: none;">
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="handleSignIn()" style="background: #1a1a18; color: white; border: none; padding: 14px; border-radius: 30px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s;">Sign In</button>
                <button onclick="loadDemoProfile()" style="background: #f1f5ff; color: #005fcc; border: 1px solid #dbeafe; padding: 12px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer;">Load Demo Profile (Bhavya Amin)</button>
            </div>
        </div>
    </div>

    <main class="main" id="main">
        <!-- Sections injected here -->
    </main>

    <div class="actions">
        <button class="btn btn-icon btn-prev" id="prevBtn" aria-label="Previous">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <span class="step-counter-pill" id="actionStepCounter">1 / 25</span>
        <button class="btn btn-icon btn-next" id="nextBtn" aria-label="Next Step">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </button>
        <button id="startMatchingBtn" class="btn btn-next"
            style="display: none; color: white; border-radius: 30px; text-decoration: none; font-weight: 500; cursor: pointer; padding: 12px 24px;"
            onclick="onStartMatching()">Start Matching</button>
    </div>



    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/onboarding.js"></script>
</body>

</html>
