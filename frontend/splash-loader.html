<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workin' | Matching Your Profile...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .logo-loader {
            position: relative;
            width: 150px;
        }

        .logo-background {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0.3;
        }

        .logo-foreground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: inset(0 100% 0 0);
            animation: sweepRightDynamic 5s linear infinite;
        }

        @keyframes sweepRightDynamic {
            0% { clip-path: inset(0 100% 0 0); }
            10% { clip-path: inset(0 70% 0 0); }
            25% { clip-path: inset(0 30% 0 0); }
            35% { clip-path: inset(0 0 0 0); }
            45% { clip-path: inset(0 0 0 30%); }
            60% { clip-path: inset(0 0 0 70%); }
            70% { clip-path: inset(0 0 0 100%); }
            100% { clip-path: inset(0 0 0 100%); }
        }
    </style>
</head>

<body>
    <div class="logo-loader">
        <img src="assets/images/loader-logo-background.png" alt="Loading..." class="logo-background">
        <img src="assets/images/loader-logo-foreground.png" alt="" class="logo-foreground">
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'jobs-board.html';
        }, 3000);
    </script>
</body>

</html>
